name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows too: .gitattributes and the hooks go out of their way to keep
        # the tool working there.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  design:
    # Held for every contributor, not only for Claude Code sessions with the
    # godesign plugin: the code keeps design/invariants.ofn, and a pull
    # request's code matches the plan it brings. godesign
    # (github.com/LukasSelin/godesign) does the checking.
    name: Design checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Install godesign
        run: GOBIN="$RUNNER_TEMP" go install github.com/LukasSelin/godesign/cmd/godesign@latest
      - name: godesign invariants
        run: '"$RUNNER_TEMP/godesign" invariants -fail-on warning'
      - name: godesign conform
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git merge-base HEAD "origin/$BASE_REF")"
          "$RUNNER_TEMP/godesign" conform -base "$base" -fail-on warning
