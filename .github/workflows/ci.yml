name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows too: .gitattributes and the hooks go out of their way to keep
        # the tool working there.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  design:
    # godesign (github.com/LukasSelin/godesign) does the checking. Every change
    # keeps design/invariants.ofn, the rules gowl's layers keep. Planning a
    # change first is opt-in (see CONTRIBUTING.md), so a pull request is held
    # to a plan only when it brings one.
    name: Design checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Install godesign
        run: GOBIN="$RUNNER_TEMP" go install github.com/LukasSelin/godesign/cmd/godesign@latest
      - name: godesign invariants
        run: '"$RUNNER_TEMP/godesign" invariants -fail-on warning'
      - name: godesign conform
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git merge-base HEAD "origin/$BASE_REF")"
          # The plans conform would read: the .ofn files under design/ that
          # this pull request adds or changes, other than the invariants.
          # Without one, conform would report every new type as unplanned.
          plans="$(git diff --name-only --diff-filter=d "$base" -- design |
            grep -i '\.ofn$' | grep -iv '/invariants\.ofn$' || true)"
          if [ -z "$plans" ]; then
            echo "This pull request brings no plan under design/, so there is no plan to hold its code to."
            exit 0
          fi
          "$RUNNER_TEMP/godesign" conform -base "$base" -fail-on warning
